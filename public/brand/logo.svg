<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Trovert Cinema">
  <defs>
    <clipPath id="circle"><circle cx="256" cy="256" r="248"/></clipPath>
    <linearGradient id="beam" x1="256" y1="150" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7D9B8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#F7D9B8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .script { font-family: "Playfair Display", "Didot", "Bodoni MT", Georgia, serif; font-style: italic; font-weight: 700; }
    </style>
  </defs>

  <g clip-path="url(#circle)">
    <!-- top half: deep maroon -->
    <rect x="0" y="0" width="512" height="256" fill="#6E101A"/>
    <!-- bottom half: blush cream -->
    <rect x="0" y="256" width="512" height="256" fill="#FBE0E0"/>

    <!-- projector beam from top, fading into the divide -->
    <path d="M256 168 L372 262 L140 262 Z" fill="url(#beam)"/>

    <!-- projector head -->
    <g fill="none" stroke="#FBE0E0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="228" y="140" width="56" height="30" rx="6"/>
      <circle cx="242" cy="130" r="12"/>
      <circle cx="270" cy="132" r="9"/>
      <path d="M284 150 l16 -8 v26 l-16 -8 z"/>
    </g>

    <!-- horizon line -->
    <path d="M0 262 H512" stroke="#6E101A" stroke-width="5" opacity=".25"/>

    <!-- cinema seat row silhouette sitting on the divide -->
    <g fill="none" stroke="#6E101A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 262 v-30 a10 10 0 0 1 10 -10 h30 a10 10 0 0 1 10 10 v30"/>
      <path d="M212 262 v-38 a10 10 0 0 1 10 -10 h32 a10 10 0 0 1 10 10 v38"/>
      <path d="M276 262 v-38 a10 10 0 0 1 10 -10 h32 a10 10 0 0 1 10 10 v38"/>
      <path d="M340 262 v-30 a10 10 0 0 1 10 -10 h30 a10 10 0 0 1 10 10 v30"/>
      <path d="M140 262 h240" stroke-width="6"/>
    </g>

    <!-- word marks -->
    <text class="script" x="256" y="118" font-size="86" fill="#FBE0E0" text-anchor="middle">Trovert</text>
    <text class="script" x="256" y="392" font-size="86" fill="#6E101A" text-anchor="middle">Cinema</text>

    <!-- film sprocket accents along the lower arc -->
    <g fill="#6E101A" opacity=".9">
      <rect x="120" y="424" width="18" height="14" rx="3"/>
      <rect x="152" y="434" width="18" height="14" rx="3"/>
      <rect x="342" y="434" width="18" height="14" rx="3"/>
      <rect x="374" y="424" width="18" height="14" rx="3"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#6E101A" stroke-width="8"/>
</svg>
